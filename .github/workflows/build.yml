    const express = require("express");
const mongoose = require("mongoose");
const cors = require("cors");

const app = express();
app.use(cors());
app.use(express.json());

mongoose.connect("mongodb://localhost:27017/water_reports");

const Report = mongoose.model("Report", {
  issueType: String,
  description: String,
  location: String,
  status: String,
  date: Date
});

app.post("/report", async (req,res)=>{
  const report = new Report({
    issueType:req.body.issueType,
    description:req.body.description,
    location:req.body.location,
    status:"Reported",
    date:new Date()
  });

  await report.save();
  res.send("Report submitted");
});

app.get("/reports", async(req,res)=>{
  const reports = await Report.find();
  res.json(reports);
});

app.listen(3000, ()=>{
  console.log("Server running");
});
import React, {useState} from "react";
import {View, Text, TextInput, Button} from "react-native";

export default function ReportIssue(){

const [issue,setIssue] = useState("");
const [description,setDescription] = useState("");
const [location,setLocation] = useState("");

const submitReport = async () => {

await fetch("http://YOURSERVER:3000/report",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
issueType:issue,
description:description,
location:location
})
});

alert("Report sent successfully");

};

return(

<View>

<Text>Issue Type</Text>
<TextInput onChangeText={setIssue} />

<Text>Description</Text>
<TextInput onChangeText={setDescription} />

<Text>Location</Text>
<TextInput onChangeText={setLocation} />

<Button title="Submit Report" onPress={submitReport}/>

</View>

);

}
<h2>Moqhaka Municipality Water Reports</h2>

<div id="reports"></div>

<script>

async function loadReports(){

const res = await fetch("http://localhost:3000/reports");

const data = await res.json();

let html = "";

data.forEach(r=>{
html += `
<div>
<h3>${r.issueType}</h3>
<p>${r.description}</p>
<p>${r.location}</p>
<p>Status: ${r.status}</p>
</div>
`;
});

document.getElementById("reports").innerHTML = html;

}

loadReports();

</script>
